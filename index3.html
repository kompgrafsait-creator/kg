<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-translate="title">Компьютерная графика — Главная</title>
  <style>
    :root {
      --pink: #ff4081;
      --pink-dark: #ff1c63;
      --card-bg: rgba(255,255,255,0.04);
    }
    
    /* Стили для переключателя языков */
    .lang-switcher {
        position: fixed;
        top: 80px;
        right: 20px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 8px;
        backdrop-filter: blur(6px);
        z-index: 999;
        box-shadow: 0 8px 20px rgba(255, 64, 129, 0.12);
    }

    .lang-btn {
        padding: 8px 16px;
        border: none;
        background: none;
        cursor: pointer;
        border-radius: 8px;
        margin: 0 2px;
        transition: all 0.3s;
        color: #d0d0d3;
        font-weight: 600;
        font-size: 14px;
    }

    .lang-btn.active {
        background: var(--pink);
        color: white;
        box-shadow: 0 4px 12px rgba(255, 64, 129, 0.2);
    }

    .lang-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--pink);
    }

    .lang-btn.active:hover {
        background: var(--pink-dark);
        color: white;
    }
    
    *{box-sizing:border-box}
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000A1C; /* Темносиний фон */
      color: white;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      backdrop-filter: blur(6px);
      background: rgba(0,0,0,0.8);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      z-index: 1000;
    }
    .container {max-width:1200px;margin:0 auto;padding:0 20px;}
    nav {display:flex;align-items:center;justify-content:space-between;padding:12px 0;}
    .logo {font-weight:700;color:var(--pink);}
    nav a {color:inherit;text-decoration:none;font-weight:600;}
    nav a:hover {color:var(--pink);}
    .hero {
      height:86vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:0 20px;
    }
    .hero-inner {max-width:900px;}
    .hero p {color:#cfcfd1;margin:0 0 24px;font-size:18px;}
    .btn {
      display:inline-block;
      padding:12px 26px;
      border-radius:12px;
      background:var(--pink);
      color:#fff;
      text-decoration:none;
      font-weight:700;
      box-shadow:0 6px 20px rgba(255,64,129,0.12);
      transition:all .22s;
    }
    .btn:hover {
      transform:translateY(-3px);
      background:var(--pink-dark);
      box-shadow:0 12px 30px rgba(255,64,129,0.22);
    }
    main {padding-top:78px;}
    footer {
      padding:18px 20px;
      text-align:center;
      color:#a9a9ac;
      border-top:1px solid rgba(255,255,255,0.03);
      background:transparent;
    }
    .fade-in {
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Переключатель языков -->
  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="ru">RU</button>
    <button class="lang-btn" data-lang="kz">KZ</button>
  </div>

  <header>
    <div class="container">
      <nav>
        <div class="logo">CG 3 Курс</div>
        <div>
          <a href="index3.html" data-translate="nav_home">Главная</a>
          &nbsp;&nbsp;
          <a href="topics.html" data-translate="nav_topics">Разделы</a>
          &nbsp;&nbsp;
          <a href="tasks.html" data-translate="nav_labs">Презентации</a>
          &nbsp;&nbsp;
          <a href="vopros.html" data-translate="nav_questions">Вопросы</a>
          &nbsp;&nbsp;
          <a href="test.html" data-translate="nav_tests">Тесты</a>
          &nbsp;&nbsp;
          <a href="video.html" data-translate="nav_video">Видео материалы</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <video 
          autoplay 
          muted 
          playsinline 
          class="fade-in"
          width="900" height="500"
          style="background:transparent; border:none;"
          onended="this.pause(); this.currentTime=this.duration;">
          <source src="animation_100ms_once.webm" type="video/webm">
          <source src="animsi.mp4" type="video/mp4">
          <span data-translate="video_not_supported">Ваш браузер не поддерживает видео.</span>
        </video>

        <p data-translate="hero_text">Профессиональная работа с графикой и 3D в Illustrator, Blender и After Effects.</p>
        <a href="index.html" class="btn" data-translate="btn_topics">Перейти к курсам</a>
      </div>
    </section>
  </main>

  <footer data-translate="footer">
    © 2025 Компьютерная графика. Все права защищены.
  </footer>

  <script>
    // Тексты для перевода
    const translations = {
      ru: {
        "title": "Компьютерная графика — Главная",
        "nav_home": "Главная",
        "nav_topics": "Разделы",
        "nav_labs": "Презентации",
        "nav_questions": "Вопросы",
        "nav_tests": "Тесты",
        "nav_video": "Видео материалы",
        "hero_text": "Профессиональная работа с графикой и 3D в Illustrator, Blender и After Effects.",
        "btn_topics": "Перейти к курсам",
        "video_not_supported": "Ваш браузер не поддерживает видео.",
        "footer": "© 2025 Компьютерная графика. Все права защищены."
      },
      kz: {
        "title": "Компьютерлік графика — Басты бет",
        "nav_home": "Басты",
        "nav_topics": "Бөлімдер",
        "nav_labs": "Презентациялар",
        "nav_questions": "Сұрақтар",
        "nav_tests": "Тесттер",
        "nav_video": "Бейне материалдар",
        "hero_text": "Illustrator, Blender және After Effects бағдарламаларында графика және 3D-мен кәсіби жұмыс.",
        "btn_topics": "Курстарға барыңыз",
        "video_not_supported": "Сіздің браузеріңіз бейнені қолдамайды.",
        "footer": "© 2025 Компьютерлік графика. Барлық құқықтар қорғалған."
      }
    };

    // Функция для применения перевода
    function applyTranslation(lang) {
      const elements = document.querySelectorAll('[data-translate]');
      
      elements.forEach(element => {
        const key = element.getAttribute('data-translate');
        if (translations[lang] && translations[lang][key]) {
          if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
            element.placeholder = translations[lang][key];
          } else if (element.tagName === 'TITLE') {
            document.title = translations[lang][key];
          } else {
            element.textContent = translations[lang][key];
          }
        }
      });

      // Обновляем атрибут lang у html элемента
      document.documentElement.lang = lang;
      
      // Обновляем активную кнопку
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.getAttribute('data-lang') === lang) {
          btn.classList.add('active');
        }
      });

      // Сохраняем выбор в localStorage
      localStorage.setItem('preferred-language', lang);
    }

    // Обработчики событий для кнопок переключения языка
    document.querySelectorAll('.lang-btn').forEach(button => {
      button.addEventListener('click', function() {
        const lang = this.getAttribute('data-lang');
        applyTranslation(lang);
      });
    });

    // При загрузке страницы проверяем сохраненный язык или язык браузера
    document.addEventListener('DOMContentLoaded', function() {
      const savedLang = localStorage.getItem('preferred-language');
      const browserLang = navigator.language.split('-')[0];
      
      if (savedLang) {
        applyTranslation(savedLang);
      } else if (browserLang === 'kk' || browserLang === 'kz') {
        applyTranslation('kz');
      } else {
        applyTranslation('ru');
      }
    });
  </script>
</body>
</html>
